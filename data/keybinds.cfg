# Semantic gameplay bindings. Edit and restart to apply.
# Keys: A-Z, 0-9, F1-F12, SPACE, ENTER, TAB, BACKSPACE, ESCAPE,
# LEFT, RIGHT, UP, DOWN, LSHIFT/RSHIFT, LCTRL/RCTRL, LALT/RALT.
# Mouse: MOUSE_LEFT/RIGHT/MIDDLE or MOUSE_1 through MOUSE_8.
# Separate two bindings with a comma.
move_forward=W
move_backward=S
move_left=A
move_right=D
sprint=LSHIFT,RSHIFT
crouch=LCTRL,RCTRL
jump=SPACE
grapple=F
lean_left=Q
lean_right=E
fire=MOUSE_LEFT
aim=MOUSE_RIGHT
reload=R
# Fits the next optic in the rack, and wraps: four of them, widest window to
# narrowest. What changes is where the glass sits, how much of the room you
# keep around the target, and how long the gun takes to come up.
next_sight=L
toggle_view=V
front_view=B
pause=ESCAPE
resume=ENTER

# Development control: pays a flat figure into your own health, so the death and
# respawn loop can be driven by hand until something in the world shoots back.
debug_damage=K

# Development control: arms the next weapon in the registry, so a new weapon can
# be looked at without a rebuild and a walk back across the map.
debug_next_weapon=J

# Development controls, and only in a build with the tuning overlay (make tune):
# F5 re-reads the held weapon's placement.json so a nudged number is on screen
# without a rebuild; F6 prints it back as C to paste into weapon_specs.c.
debug_reload_placement=F5
debug_bake_placement=F6
